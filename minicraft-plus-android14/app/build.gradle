plugins {
    id 'com.android.application'
}

android {
    namespace 'org.minicraftplus.android'
    compileSdk 34

    defaultConfig {
        applicationId 'org.minicraftplus.android'
        minSdk 23
        targetSdk 34
        versionCode 18
        versionName '2.0.1'
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // A separately installable test build. Its package name ends in .dev,
        // so Android keeps it alongside the normal Minicraft+ application.
        dev {
            initWith debug
            applicationIdSuffix '.v201'
            versionNameSuffix '-dev'
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "Minicraft-${variant.versionName}.apk"
    }
}
// The game creates its touch UI programmatically. Excluding the generated
// resource compile jar avoids a Windows file-lock issue in this environment.
afterEvaluate {
    tasks.withType(JavaCompile).configureEach {
        classpath = files(classpath.filter { it.name != 'R.jar' })
    }
}
android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "Minicraft-${variant.versionName}.apk"
    }
}
